[package]
name = "profiler"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"], optional = true }

[features]
egui = ["dep:egui"]
server = []

[dev-dependencies]
eframe = "0.37"

[[example]]
name = "egui_tree"
required-features = ["egui"]

[[example]]
name = "serve"
required-features = ["server"]

[[example]]
name = "self_profile"
required-features = ["server"]

# Release speed with debug info, so perf can attribute inlined profiler code.
[profile.profiling]
inherits = "release"
debug = true
